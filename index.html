
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 메모장</title>

  <!-- CSS: 화면 디자인 -->
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
    }

    header {
      background: #1e3a8a;
      color: white;
      padding: 30px;
      border-radius: 16px;
      margin-bottom: 24px;
    }

    header h1 {
      margin: 0 0 10px;
    }

    header p {
      margin: 0;
      color: #dbeafe;
    }

    .write-box {
      background: white;
      padding: 24px;
      border-radius: 16px;
      margin-bottom: 24px;
      box-shadow: 0 3px 10px #00000008;
    }

    input, textarea {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .save-btn {
      width: 100%;
      margin-top: 12px;
      background: #2563eb;
      color: white;
    }

    .save-btn:hover {
      background: #1d4ed8;
    }

    .memo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .memo-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px #00000008;
    }

    .memo-card h3 {
      margin: 0 0 10px;
      word-break: break-word;
    }

    .memo-card p {
      color: #475569;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    .memo-date {
      font-size: 12px;
      color: #94a3b8;
    }

    .delete-btn {
      background: #fee2e2;
      color: #dc2626;
      margin-top: 8px;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #94a3b8;
      background: white;
      border-radius: 12px;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px 12px;
      }

      header {
        padding: 24px;
      }

      .write-box {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- 상단 제목 -->
    <header>
      <h1>📝 My Memo</h1>
      <p>나만의 생각과 아이디어를 기록하세요.</p>
    </header>

    <!-- 메모 작성 영역 -->
    <section class="write-box">
      <h2>새 메모 작성</h2>

      <input
        type="text"
        id="memoTitle"
        placeholder="메모 제목을 입력하세요"
      >

      <textarea
        id="memoContent"
        placeholder="메모 내용을 입력하세요..."
      ></textarea>

      <button class="save-btn" onclick="addMemo()">
        + 메모 저장하기
      </button>
    </section>

    <!-- 메모 목록 영역 -->
    <section>
      <div class="memo-header">
        <h2>내 메모</h2>
        <span id="memoCount">0개</span>
      </div>

      <div id="memoList"></div>
    </section>

  </div>

  <!-- JavaScript: 메모 기능 -->
  <script>

    // 저장된 메모 불러오기
    let memos = JSON.parse(
      localStorage.getItem("myMemos") || "[]"
    );

    // 메모 추가하기
    function addMemo() {

      const titleInput = document.getElementById("memoTitle");
      const contentInput = document.getElementById("memoContent");

      const title = titleInput.value.trim();
      const content = contentInput.value.trim();

      // 빈 내용 확인
      if (!title || !content) {
        alert("제목과 내용을 모두 입력해주세요!");
        return;
      }

      // 새로운 메모 만들기
      const newMemo = {
        id: Date.now() + Math.random(),
        title: title,
        content: content,
        date: new Date().toLocaleString("ko-KR")
      };

      // 메모 목록에 추가
      memos.unshift(newMemo);

      // 저장 및 화면 업데이트
      saveMemos();

      // 입력창 비우기
      titleInput.value = "";
      contentInput.value = "";

    }

    // 메모 저장하기
    function saveMemos() {

      localStorage.setItem(
        "myMemos",
        JSON.stringify(memos)
      );

      renderMemos();

    }

    // 메모 목록 화면에 표시하기
    function renderMemos() {

      const memoList = document.getElementById("memoList");
      const memoCount = document.getElementById("memoCount");

      memoList.innerHTML = "";

      memoCount.textContent = memos.length + "개";

      // 메모가 없는 경우
      if (memos.length === 0) {

        memoList.innerHTML = `
          <div class="empty">
            아직 작성한 메모가 없습니다.<br>
            첫 번째 메모를 작성해보세요!
          </div>
        `;

        return;
      }

      // 메모 하나씩 출력
      memos.forEach(function(memo) {

        const card = document.createElement("div");
        card.className = "memo-card";

        const title = document.createElement("h3");
        title.textContent = memo.title;

        const content = document.createElement("p");
        content.textContent = memo.content;

        const date = document.createElement("div");
        date.className = "memo-date";
        date.textContent = memo.date;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-btn";
        deleteButton.textContent = "삭제";

        deleteButton.addEventListener("click", function() {
          deleteMemo(memo.id);
        });

        card.appendChild(title);
        card.appendChild(content);
        card.appendChild(date);
        card.appendChild(deleteButton);

        memoList.appendChild(card);

      });

    }

    // 메모 삭제하기
    function deleteMemo(id) {

      if (!confirm("이 메모를 삭제하시겠습니까?")) {
        return;
      }

      memos = memos.filter(function(memo) {
        return memo.id !== id;
      });

      saveMemos();

    }

    // 처음 화면 실행
    renderMemos();

  </script>

</body>
</html>
